<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#a8204f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Pedidos Avon</title>
<style>
/* Una columna angosta para el celular: resumen arriba, lista en el medio, botón flotante para cargar pedidos. Todo se guarda en el propio dispositivo. */
:root{
  --bg:#f6f4f6; --surface:#ffffff; --ink:#1e1a21; --muted:#6d6572; --line:#e4dfe6;
  --accent:#a8204f; --accent-ink:#ffffff; --accent-soft:#f8e6ed;
  --ok:#1b7a4b; --ok-soft:#e1f2e8; --warn:#9a5b00; --warn-soft:#fbeed6; --danger:#b3261e;
  --f-display:"Avenir Next","Trebuchet MS",system-ui,sans-serif; --f-body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#17131a; --surface:#221c26; --ink:#f1ecf3; --muted:#a79eae; --line:#372f3d;
  --accent:#e0568a; --accent-ink:#1a0d13; --accent-soft:#3a1d2b;
  --ok:#5fd394; --ok-soft:#173424; --warn:#f0b45a; --warn-soft:#3a2b12; --danger:#ff8a80; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body);padding-inline:16px;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:110px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font:800 30px/1 var(--f-display);margin:0;letter-spacing:-.02em}
h2{font:800 20px/1.2 var(--f-display);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.top-actions{display:flex;gap:8px;align-items:center}
select,input[type=text],input[type=search],input[type=number],textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
textarea{resize:vertical;min-height:96px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 14px;min-height:44px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.btn.danger{color:var(--danger)}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:8px 12px;font-size:14px;line-height:1.3;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-weight:500}
.banner.err{background:var(--accent-soft);color:var(--danger)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .k{font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.stat .v{font:800 clamp(17px,5.4vw,24px)/1.1 var(--f-display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat .s{font-size:14px;color:var(--muted)}
.stat.pend .v{color:var(--warn)} .stat.sent .v{color:var(--accent)} .stat.done .v{color:var(--ok)}
.stat.wide{grid-column:1/-1;flex-direction:row;flex-wrap:wrap;align-items:baseline;justify-content:space-between;column-gap:10px}
.tabs{display:flex;gap:6px;background:var(--line);padding:4px;border-radius:12px}
.tab{flex:1;min-width:0;border:0;background:transparent;border-radius:9px;min-height:48px;padding:2px 2px;font-weight:600;font-size:14px;line-height:1.2;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center}
.tab>span:first-child{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab .cnt{font-variant-numeric:tabular-nums;font-weight:800;font-size:16px}
.tab[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters>*{flex:1 1 160px;min-width:0}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.card-head{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:14px;min-height:64px}
.card-head .who{flex:1;min-width:0}
.card-head .name{font-weight:600;font-size:17px;overflow-wrap:anywhere}
.card-head .meta{font-size:14px;color:var(--muted)}
.card-head .amt{font:800 18px/1 var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.card-head .side{text-align:right;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.pill{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;border-radius:99px;padding:3px 9px}
.pill.p{background:var(--warn-soft);color:var(--warn)} .pill.s{background:var(--accent-soft);color:var(--accent)} .pill.d{background:var(--ok-soft);color:var(--ok)}
.detail{border-top:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:12px}
.items{display:flex;flex-direction:column;gap:8px}
.it{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:baseline}
.it .q{font-weight:600;font-variant-numeric:tabular-nums;color:var(--accent)}
.it .n{min-width:0;overflow-wrap:anywhere}
.it .c{font-size:13px;color:var(--muted)}
.it .p{font-variant-numeric:tabular-nums;white-space:nowrap}
.note{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:15px;overflow-wrap:anywhere}
.shots{display:flex;gap:8px;flex-wrap:wrap}
.shots img{width:96px;height:96px;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:zoom-in;background:var(--bg)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.empty{text-align:center;color:var(--muted);padding:40px 16px;border:1px dashed var(--line);border-radius:14px}
.empty b{display:block;color:var(--ink);font:800 20px var(--f-display);margin-bottom:6px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));min-height:56px;border-radius:28px;padding:0 22px;box-shadow:0 6px 20px rgba(0,0,0,.28);font-size:17px}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto;padding-inline:16px;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.sheet .inner{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.lbl{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.row2{display:grid;grid-template-columns:1fr 110px;gap:10px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.paste{background:var(--accent-soft);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.irow{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;grid-template-columns:64px 1fr 1fr;gap:8px}
.irow .full{grid-column:1/-1}
.irow input{min-height:40px;padding:8px 10px}
.irow .del{grid-column:1/-1;justify-self:end}
.tot{display:flex;justify-content:space-between;align-items:baseline;font:800 22px var(--f-display);font-variant-numeric:tabular-nums}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{position:relative}
.thumb img{width:84px;height:84px;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block}
.thumb button{position:absolute;top:-6px;right:-6px;width:26px;height:26px;border-radius:50%;border:0;background:var(--danger);color:#fff;font-weight:700;line-height:1}
.hint{font-size:14px;color:var(--muted)}
.results{display:flex;flex-direction:column;gap:6px}
.res{display:flex;justify-content:space-between;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:48px;align-items:center}
.res .n{min-width:0;overflow-wrap:anywhere}
.res .c{font-size:13px;color:var(--muted)}
.res .p{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
.lightbox{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;padding:16px}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:50;font-size:15px;max-width:calc(100% - 32px)}
.irow input.bad{border-color:var(--danger);background:var(--accent-soft)}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:14px;display:flex;flex-direction:column;gap:4px;overflow-wrap:anywhere}
.warnbox.red{background:var(--accent-soft);color:var(--danger);font-weight:600}
.dlgback{position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:var(--surface);border-radius:14px;padding:16px;max-width:420px;width:100%;max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.brand{font-size:12px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.04em}
@media (max-width:420px){.wrap{gap:10px}.tab{font-size:12px;letter-spacing:-.01em}.tab .cnt{font-size:15px}.card-head .side{max-width:46%}.bulk .btn{flex:1 1 0;padding:0 8px;font-size:15px}.irow{grid-template-columns:60px 1fr}.irow .code{grid-column:2}.card-head .amt{font-size:16px}}
@media (max-width:380px){.tab{font-size:11px}}
@media (max-width:340px){.tab{font-size:10px}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="top">
    <h1>Pedidos Avon</h1>
    <div class="top-actions">
      <button class="btn" id="btnExport" type="button">Excel</button>
      <button class="btn" id="btnSettings" type="button">Ajustes</button>
    </div>
  </div>
  <div id="banners"></div>
  <div class="stats" id="stats"></div>
  <div class="filters">
    <select id="fCycle" aria-label="Ciclo"></select>
    <input type="search" id="fSearch" placeholder="Buscar cliente o producto" aria-label="Buscar">
  </div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="list" id="list"></div>
</div>
<button class="btn primary fab" id="fab" type="button">+ Nuevo pedido</button>
<div id="overlay"></div>

<script src="xlsx.min.js"></script>
<script>
(function(){
  var orders=[], catalogs={}, meta={cicloActual:'',lastBackup:null}, ready=false, loadError=null;
  var ui={tab:'pendiente',cycle:'',q:'',open:null,confirmDel:null};
  var form=null, settings=null;
  var $=function(id){return document.getElementById(id)};

  /* ---------- Almacenamiento local (IndexedDB) ---------- */
  var IDB={db:null,
    open:function(){return new Promise(function(res,rej){
      if(!window.indexedDB){rej(new Error('sin indexedDB'));return}
      var r=indexedDB.open('pedidos-avon',1);
      r.onupgradeneeded=function(){var d=r.result;
        d.createObjectStore('orders',{keyPath:'id'});d.createObjectStore('shots',{keyPath:'id'});
        d.createObjectStore('catalog',{keyPath:'cycle'});d.createObjectStore('meta',{keyPath:'k'});};
      r.onsuccess=function(){IDB.db=r.result;res()};r.onerror=function(){rej(r.error)};
    })},
    tx:function(store,mode,fn){return new Promise(function(res,rej){
      var t=IDB.db.transaction(store,mode),s=t.objectStore(store),r=fn(s);
      t.oncomplete=function(){res(r&&r.result)};t.onerror=function(){rej(t.error)};t.onabort=function(){rej(t.error)};
    })},
    all:function(s){return IDB.tx(s,'readonly',function(o){return o.getAll()})},
    get:function(s,k){return IDB.tx(s,'readonly',function(o){return o.get(k)})},
    put:function(s,v){return IDB.tx(s,'readwrite',function(o){return o.put(v)})},
    del:function(s,k){return IDB.tx(s,'readwrite',function(o){return o.delete(k)})},
    clear:function(s){return IDB.tx(s,'readwrite',function(o){return o.clear()})}
  };
  function setMeta(k,v){meta[k]=v;return IDB.put('meta',{k:k,v:v})}
  function touch(){return setMeta('dirty',(Number(meta.dirty)||0)+1)}

  /* ---------- Utilidades ---------- */
  function h(tag,attrs){
    var el=document.createElement(tag);
    if(attrs)for(var k in attrs){var v=attrs[k];
      if(v==null||v===false)continue;
      if(k==='class')el.className=v;
      else if(k==='text')el.textContent=v;
      else if(k.slice(0,2)==='on')el.addEventListener(k.slice(2),v);
      else if(v===true)el.setAttribute(k,'');
      else el.setAttribute(k,v);
    }
    for(var i=2;i<arguments.length;i++){var c=arguments[i];
      if(c==null||c===false)continue;
      el.appendChild(typeof c==='string'?document.createTextNode(c):c);}
    return el;
  }
  var moneyS=function(n){n=Number(n)||0;return Number.isInteger(n)?n.toLocaleString('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}):money(n)};
  var money=function(n){return (Number(n)||0).toLocaleString('es-AR',{style:'currency',currency:'ARS'})};
  function parseMoney(s){
    s=String(s==null?'':s).replace(/[^\d.,]/g,'');
    if(!s)return 0;
    if(s.indexOf(',')>-1){s=s.replace(/\./g,'').replace(',','.')}
    else if(/^\d{1,3}(\.\d{3})+$/.test(s)){s=s.replace(/\./g,'')}
    var n=parseFloat(s);return isNaN(n)?0:n;
  }
  function norm(s){return String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim()}
  function orderTotal(o){return (o.items||[]).reduce(function(a,i){return a+(Number(i.qty)||0)*(Number(i.price)||0)},0)}
  function fmtDate(iso){try{var d=new Date(iso),o={day:'numeric',month:'short'};if(d.getFullYear()!==new Date().getFullYear())o.year='numeric';return d.toLocaleDateString('es-AR',o)}catch(e){return ''}}
  function pad2(n){return (n<10?'0':'')+n}
  function dateSerial(iso){var d=new Date(iso);if(isNaN(d.getTime()))return '';return Math.round(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000)+25569}
  function cleanCode(c){return String(c==null?'':c).trim().replace(/\*+$/,'').trim()}
  var ST_LABEL={pendiente:'Por enviar',enviado:'Enviado',entregado:'Entregado'};
  var ST_PILL={pendiente:'p',enviado:'s',entregado:'d'};
  function itemBrand(o,i){
    if(i&&i.brand)return i.brand;
    var hit=i&&i.code?findByCode(o.cycle,i.code):null;
    return (hit&&hit.brand)||'';
  }
  function qtyOk(q){q=Number(q);return Number.isInteger(q)&&q>=1}
  function ckey(c){return norm(c).replace(/\s+/g,' ')}
  function canonMap(){var m={};orders.slice().sort(function(a,b){return String(a.createdAt).localeCompare(String(b.createdAt))}).forEach(function(o){var k=ckey(o.client);if(k&&!m[k])m[k]=String(o.client).trim()});return m}
  function cname(m,c){return m[ckey(c)]||c||''}
  var lastFocus={dlg:null,form:null,settings:null,lb:null};
  function back(el,fallback){try{if(el&&document.body.contains(el)){el.focus();return}}catch(e){}if(fallback)fallback.focus()}
  var dlgEl=null;
  function closeDlg(){if(dlgEl){dlgEl.remove();dlgEl=null;back(lastFocus.dlg)}}
  function openDlg(title,body,buttons){
    if(dlgEl){dlgEl.remove();dlgEl=null}
    lastFocus.dlg=document.activeElement;
    var acts=h('div',{class:'actions'});buttons.forEach(function(b){acts.appendChild(b)});
    dlgEl=h('div',{class:'dlgback'},h('div',{class:'dlg',role:'dialog','aria-modal':'true','aria-label':title},h('h2',{text:title}),body,acts));
    document.body.appendChild(dlgEl);
    var f=dlgEl.querySelector('button');if(f)f.focus();
  }
  function toast(msg){
    var t=h('div',{class:'toast',role:'status',text:msg});document.body.appendChild(t);
    setTimeout(function(){t.remove()},3200);
  }
  function rid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
  function saveFile(filename,data,type){
    var blob=data instanceof Blob?data:new Blob([data],{type:type||'application/octet-stream'});
    var url=URL.createObjectURL(blob),a=h('a',{href:url,download:filename});
    document.body.appendChild(a);a.click();
    setTimeout(function(){a.remove();URL.revokeObjectURL(url)},1500);
  }
  function stamp(){var d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())}
  function hhmm(){var d=new Date();return pad2(d.getHours())+pad2(d.getMinutes())}

  /* ---------- Lector del mensaje de WhatsApp ---------- */
  function parseWhatsApp(text){
    var items=[],bad=[],re=/(\d+)\s*unidad(?:\(es\)|es)?\s*-\s*C[oó]digo:\s*(\S+)\s*-\s*Precio:\s*\$?\s*([\d.,]+)\s*-\s*(.+)/i;
    text.split(/\r?\n/).forEach(function(line){
      var m=line.match(re);
      if(m&&m[4].trim()){items.push({qty:parseInt(m[1],10)||1,code:cleanCode(m[2]),price:parseMoney(m[3]),name:m[4].trim()});return}
      if(/C[oó]digo\s*:/i.test(line))bad.push(line.trim());
    });
    var cm=text.match(/Ciclo\s*(\d+)/i), tm=text.match(/Total\s*=\s*\$?\s*([\d.,]+)/i);
    var total=tm?parseMoney(tm[1]):null,converted=false;
    if(total!=null&&items.some(function(i){return i.qty>1})){
      var unit=items.reduce(function(a,i){return a+i.qty*i.price},0);
      var line=items.reduce(function(a,i){return a+i.price},0);
      if(Math.abs(unit-total)>1&&Math.abs(line-total)<=1){items.forEach(function(i){i.price=i.price/i.qty});converted=true}
    }
    var sum=items.reduce(function(a,i){return a+i.qty*i.price},0);
    return {items:items,cycle:cm?cm[1]:'',total:total,unreadable:bad,converted:converted,sum:sum};
  }

  /* ---------- Capturas ---------- */
  function compress(file){
    return new Promise(function(res,rej){
      var url=URL.createObjectURL(file), img=new Image();
      img.onload=function(){
        var max=1100,q=.62,out;
        for(var pass=0;pass<5;pass++){
          var s=Math.min(1,max/Math.max(img.width,img.height));
          var c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
          c.getContext('2d').drawImage(img,0,0,c.width,c.height);
          out=c.toDataURL('image/jpeg',q);
          if(out.length<230000)break;
          max=Math.round(max*.8);q=Math.max(.4,q-.06);
        }
        URL.revokeObjectURL(url);res(out);
      };
      img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('imagen'))};
      img.src=url;
    });
  }
  var shotCache={};
  function getShot(id){
    if(shotCache[id])return Promise.resolve(shotCache[id]);
    return IDB.get('shots',id).then(function(s){if(s&&s.data){shotCache[id]=s.data;return s.data}return null});
  }
  function lightbox(src){
    lastFocus.lb=document.activeElement;
    var lb=h('div',{class:'lightbox',role:'dialog','aria-label':'Captura',onclick:function(){lb.remove();back(lastFocus.lb)}},h('img',{src:src,alt:'Captura del pedido'}));
    document.body.appendChild(lb);
  }

  /* ---------- Filtros ---------- */
  function cycles(){
    var s={};orders.forEach(function(o){if(o.cycle)s[o.cycle]=1});
    if(meta.cicloActual)s[meta.cicloActual]=1;
    return Object.keys(s).sort(function(a,b){return (parseInt(b)||0)-(parseInt(a)||0)});
  }
  function byCycle(){return orders.filter(function(o){return !ui.cycle||o.cycle===ui.cycle})}
  function visible(){
    var q=norm(ui.q);
    return byCycle().filter(function(o){
      if(ui.tab!=='todos'&&o.status!==ui.tab)return false;
      if(!q)return true;
      if(norm(o.client).indexOf(q)>-1)return true;
      return (o.items||[]).some(function(i){return norm(i.name).indexOf(q)>-1||String(i.code||'').indexOf(q)>-1});
    }).sort(function(a,b){return String(b.createdAt).localeCompare(String(a.createdAt))});
  }

  /* ---------- Pantalla principal ---------- */
  function renderBanners(){
    var b=$('banners'),kids=[];
    if(loadError)kids.push(h('div',{class:'banner err',text:loadError}));
    else if(ready&&orders.length){
      var days=meta.lastBackup?Math.floor((Date.now()-new Date(meta.lastBackup).getTime())/86400000):null;
      var dirty=Number(meta.dirty)||0;
      if(days==null||(dirty>0&&days>=3)||dirty>=10){

  function pick(row,names){
    for(var k in row){var nk=norm(k);if(names.indexOf(nk)>-1)return row[k]}
    return '';
  }
  function parseCatalogFile(file){
    var ext=(file.name.split('.').pop()||'').toLowerCase();
    if(ext==='json'){
      return readFile(file,true).then(function(t){
        var d=JSON.parse(t),arr=Array.isArray(d)?d:(d.items||d.productos||[]);
        return {cycle:(d&&d.cycle)||(d&&d.ciclo)||'',items:arr.map(function(i){return{code:i.code!=null?i.code:i.codigo,name:i.name!=null?i.name:i.nombre,price:i.price!=null?i.price:i.precio,brand:i.brand||i.marca||'',promo:i.promo||i.promocion||''}})};
      });
    }
    if(typeof XLSX==='undefined')return Promise.reject(new Error('sin XLSX'));
    var p=ext==='csv'?readFile(file,true).then(function(t){return XLSX.read(t,{type:'string',raw:true})}):readFile(file,false).then(function(b){return XLSX.read(b,{type:'array'})});
    return p.then(function(wb){
      var ws=wb.Sheets[wb.SheetNames[0]];
      var raw=XLSX.utils.sheet_to_json(ws,{defval:'',raw:true}),fmt=XLSX.utils.sheet_to_json(ws,{defval:'',raw:false});
      return {cycle:'',items:raw.map(function(r,ix){var f=fmt[ix]||{};
        return{code:pick(f,['codigo','cod','code','cod.']),name:pick(r,['producto','nombre','descripcion','name','articulo']),price:pick(r,['precio','price','valor']),brand:pick(r,['marca','brand']),promo:pick(r,['promo','promocion','oferta'])}})};
    });
  }
  function cleanCatalog(items){
    var seen={},rep={items:[],read:items.length,dupes:0,noPrice:0,noCodeName:0,samples:[]};
    items.forEach(function(i){
      var code=String(i.code==null?'':i.code).trim(),name=String(i.name==null?'':i.name).trim(),brand=String(i.brand==null?'':i.brand).trim(),promo=String(i.promo==null?'':i.promo).trim();
      var price=typeof i.price==='number'?i.price:parseMoney(i.price),why=null;
      if(!code||!name){rep.noCodeName++;why='falta código o nombre'}
      else if(!(price>0)||!isFinite(price)){rep.noPrice++;why='sin precio válido'}
      else if(seen[code]){rep.dupes++;why='código repetido'}
      else{seen[code]=1;var it={code:code,name:name,price:price};if(brand)it.brand=brand;if(promo)it.promo=promo;rep.items.push(it)}
      if(why&&rep.samples.length<10)rep.samples.push((code||'(sin código)')+' · '+(name||'(sin nombre)')+': '+why);
    });
    return rep;
  }

      h('h2',{text:'Ciclo actual'}),
      h('div',{class:'hint',text:meta.cicloActual?'Los pedidos nuevos se anotan en el ciclo '+meta.cicloActual+'.':'Todavía no elegiste un ciclo.'}),
      h('div',{class:'field'},h('label',{for:'sNuevo',text:'Empezar un ciclo nuevo'}),nueva),
      h('button',{class:'btn primary',type:'button',text:'Usar este ciclo',onclick:function(){
        var v=nueva.value.trim();if(!v){toast('Escribí el número del ciclo');return}
        setMeta('cicloActual',v).then(function(){settings.catCycle=v;var pend=orders.filter(function(o){return o.status==='pendiente'&&o.cycle!==v}).length;
          toast('Ciclo '+v+' activo'+(pend?'. Quedan '+pend+' pedidos por enviar de ciclos anteriores.':''));renderSettings()});
      }}));
    var bc={};if(cat)cat.items.forEach(function(i){var b=i.brand||'sin marca';bc[b]=(bc[b]||0)+1});
    var bstr=Object.keys(bc).map(function(k){return k+' '+bc[k]}).join(', ');
    var catInfo=h('div',{class:'hint',text:cat?'Catálogo del ciclo '+cat.cycle+': '+cat.items.length+' productos'+(bstr&&Object.keys(bc).length>1||(bstr&&!bc['sin marca'])?' ('+bstr+')':'')+'.':'No hay catálogo cargado para el ciclo actual.'});
    var catBox=h('div',{class:'box'},
      h('h2',{text:'Catálogo de la revista'}),catInfo,
      h('div',{class:'hint',text:'Archivo Excel, CSV o JSON con las columnas Código, Producto y Precio (y opcional Marca). Sirve para buscar productos al anotar pedidos.'}));
    var catFile=h('input',{type:'file',id:'sCatFile',accept:'.csv,.xlsx,.xls,.json',hidden:true,onchange:function(e){
      var f=e.target.files[0];e.target.value='';if(!f)return;
      parseCatalogFile(f).then(function(r){
        var rep=cleanCatalog(r.items);
        if(!rep.read){toast('No encontré filas. Revisá las columnas Código, Producto y Precio.');return}
        settings.pendingCatalog={cycle:r.cycle||settings.catCycle||meta.cicloActual||'',items:rep.items,rep:rep,askFor:null};renderSettings();
      }).catch(function(){toast('No se pudo leer el archivo')});
    }});
    catBox.appendChild(catFile);
    if(settings.pendingCatalog){
      var pc=settings.pendingCatalog,rep=pc.rep;
      var doSave=function(mode){
        var ex=catalogs[pc.cycle],items=pc.items;
        if(mode==='merge'&&ex){var have={};ex.items.forEach(function(x){have[String(x.code)]=1});items=ex.items.concat(pc.items.filter(function(x){return !have[x.code]}))}
        var rec={cycle:pc.cycle,items:items,importedAt:new Date().toISOString()};
        IDB.put('catalog',rec).then(function(){catalogs[rec.cycle]=rec;settings.pendingCatalog=null;toast('Catálogo del ciclo '+rec.cycle+' guardado: '+items.length+' productos');renderSettings()}).catch(function(){toast('No se pudo guardar el catálogo')});
      };
      if(pc.askFor){
        var cur=catalogs[pc.askFor],n0=cur.items.length,n1=pc.items.length,pct=n0?Math.abs(n1-n0)/n0*100:0;
        var have2={};cur.items.forEach(function(x){have2[String(x.code)]=1});
        var already=pc.items.filter(function(x){return have2[x.code]}).length;
        var curP={};cur.items.forEach(function(x){curP[String(x.code)]=x.price});
        var diffP=pc.items.filter(function(x){return have2[x.code]&&curP[x.code]!==x.price}).length;
        catBox.appendChild(h('div',{class:'paste'},
          h('b',{text:'Ya hay un catálogo del ciclo '+pc.askFor+'.'}),
          h('div',{text:'Actual: '+n0+' productos. Nuevo: '+n1+' productos.'}),
          pct>20?h('div',{class:'warnbox red',role:'alert',text:'La cantidad cambia un '+Math.round(pct)+'%. Revisá que sea el archivo correcto antes de reemplazar.'}):null,
          h('div',{class:'hint',text:'“Reemplazar” borra el catálogo actual de este ciclo. “Sumar” agrega los productos nuevos y conserva los actuales (sirve para cargar otra revista en el mismo ciclo). Sumar no cambia el precio de los códigos que ya estaban; para actualizar precios usá Reemplazar. Códigos que ya estaban: '+already+' ('+diffP+' con precio distinto).'}),
          h('div',{class:'actions'},
            h('button',{class:'btn danger',type:'button',text:'Sí, reemplazar catálogo',onclick:function(){doSave('replace')}}),
            h('button',{class:'btn primary',type:'button',text:'Sumar a los actuales',onclick:function(){doSave('merge')}}),
            h('button',{class:'btn',type:'button',text:'Cancelar',onclick:function(){pc.askFor=null;renderSettings()}}))));
      }else{
        var cIn=h('input',{type:'text',id:'sCatCycle',inputmode:'numeric',value:pc.cycle,oninput:function(e){pc.cycle=e.target.value.trim()}});
        var disc=rep.dupes+rep.noPrice+rep.noCodeName;
        catBox.appendChild(h('div',{class:'paste'},
          h('b',{text:'Se leyeron '+rep.read+' filas. Guardables: '+pc.items.length+'.'}),
          disc?h('div',{class:'warnbox',role:'status'},h('div',{text:'Descartados: '+disc+' ('+rep.dupes+' por código repetido, '+rep.noPrice+' por falta de precio, '+rep.noCodeName+' por falta de código o nombre).'}),...rep.samples.map(function(x){return h('div',{text:'· '+x})})):null,
          h('div',{class:'field'},h('label',{for:'sCatCycle',text:'Guardar como catálogo del ciclo'}),cIn),
          h('div',{class:'actions'},
            pc.items.length?h('button',{class:'btn primary',type:'button',text:'Guardar catálogo',onclick:function(){
              if(!pc.cycle){toast('Falta el número de ciclo');return}
              if(catalogs[pc.cycle]){pc.askFor=pc.cycle;renderSettings();return}
              doSave('replace');
            }}):null,
            h('button',{class:'btn',type:'button',text:'Cancelar',onclick:function(){settings.pendingCatalog=null;renderSettings()}}))));
      }
    }else{
      catBox.appendChild(h('div',{class:'actions'},
        h('button',{class:'btn',type:'button',text:'Importar catálogo',onclick:function(){catFile.click()}}),
        h('button',{class:'btn',type:'button',text:'Bajar plantilla',onclick:function(){
          saveFile('plantilla-catalogo.csv','﻿Código,Producto,Precio,Marca\n166353,Hidratante facial matificante,16300,Natura\n275932,Tododia cabello detox rutina básica,27200,Natura\n','text/csv;charset=utf-8');
        }})));
    }
    var bkFile=h('input',{type:'file',id:'sBkFile',accept:'.json',hidden:true,onchange:function(e){
      var f=e.target.files[0];e.target.value='';if(!f)return;
      readFile(f,true).then(function(t){
        var d=JSON.parse(t);if(d.app!=='pedidos-avon')throw new Error('formato');
        settings.pendingBackup=d;settings.confirmReplace=false;renderSettings();
      }).catch(function(){toast('Ese archivo no es un respaldo de Pedidos Avon')});
    }});
    var bk=meta.lastBackup?'Último respaldo: '+new Date(meta.lastBackup).toLocaleDateString('es-AR',{day:'numeric',month:'long'})+'.':'Todavía no hiciste ningún respaldo.';
    var bkBox=h('div',{class:'box'},
      h('h2',{text:'Respaldo de los pedidos'}),
      h('div',{class:'hint',text:'Los pedidos se guardan solo en este dispositivo. El respaldo es un archivo: mandalo a tu WhatsApp, a Google Drive o a tu mail para tenerlo afuera del celular, o usalo para pasar todo a otro teléfono.'}),
      h('div',{class:'hint',text:bk}),bkFile);
    if(settings.pendingBackup){
      var pb=settings.pendingBackup,nOrd=(pb.orders||[]).length,nCat=(pb.catalogs||[]).length,curCat=Object.keys(catalogs).length;
      var when=isNaN(new Date(pb.exportedAt).getTime())?'':' del '+new Date(pb.exportedAt).toLocaleDateString('es-AR',{day:'numeric',month:'long'});
      if(settings.confirmReplace){
        bkBox.appendChild(h('div',{class:'paste'},
          h('b',{text:'Confirmá el reemplazo'}),
          h('div',{text:'Se borra de este dispositivo: '+orders.length+(orders.length===1?' pedido':' pedidos')+' y '+curCat+(curCat===1?' catálogo':' catálogos')+' (con las capturas).'}),
          h('div',{text:'Queda solo lo del respaldo: '+nOrd+(nOrd===1?' pedido':' pedidos')+' y '+nCat+(nCat===1?' catálogo':' catálogos')+'.'}),
          (nOrd===0&&orders.length>0)?h('div',{class:'warnbox red',role:'alert',text:'Este respaldo no tiene pedidos. Si seguís, se pierden los '+orders.length+' pedidos que tenés ahora.'}):null,
          (orders.length||curCat)?h('div',{class:'hint',text:'Antes de borrar se descarga un respaldo de lo que hay ahora. Si no se puede generar, no se borra nada.'}):null,
          h('div',{class:'actions'},
            h('button',{class:'btn danger',type:'button',text:'Sí, reemplazar',onclick:function(){
              var needs=orders.length||curCat;
              var pre=needs?preBackup().then(function(){return true},function(){return false}):Promise.resolve(true);
              pre.then(function(ok){
                if(!ok){toast('No se pudo guardar el respaldo previo. No se borró nada.');return}
                return applyBackup(pb,'replace').then(function(){settings.pendingBackup=null;settings.confirmReplace=false;toast(needs?'Datos reemplazados. Se descargó el respaldo previo.':'Datos reemplazados');renderSettings()});
              }).catch(function(){toast('No se pudo importar')});
            }}),
            h('button',{class:'btn',type:'button',text:'Cancelar',onclick:function(){settings.confirmReplace=false;renderSettings()}}))));
      }else{
        bkBox.appendChild(h('div',{class:'paste'},
          h('b',{text:'Respaldo'+when+': '+nOrd+' pedidos.'}),
          h('div',{class:'hint',text:'“Sumar” agrega lo que falta y deja lo que ya tenés. “Reemplazar” borra todo lo de este dispositivo y deja solo el respaldo (te pide confirmar).'}),
          h('div',{class:'actions'},
            h('button',{class:'btn primary',type:'button',text:'Sumar',onclick:function(){applyBackup(pb,'merge').then(function(){settings.pendingBackup=null;toast('Respaldo sumado');renderSettings()}).catch(function(){toast('No se pudo importar')})}}),
            h('button',{class:'btn danger',type:'button',text:'Reemplazar todo',onclick:function(){settings.confirmReplace=true;renderSettings()}}),
            h('button',{class:'btn',type:'button',text:'Cancelar',onclick:function(){settings.pendingBackup=null;renderSettings()}}))));
      }
    }else{
      bkBox.appendChild(h('div',{class:'actions'},
        h('button',{class:'btn primary',type:'button',text:(navigator.canShare?'Enviar respaldo':'Guardar respaldo'),onclick:function(){exportBackup(true)}}),
        navigator.canShare?h('button',{class:'btn',type:'button',text:'Bajar al celular',onclick:function(){exportBackup(false)}}):null,
        h('button',{class:'btn',type:'button',text:'Importar respaldo',onclick:function(){bkFile.click()}})));
    }
    var sheet=h('div',{class:'sheet',role:'dialog','aria-label':'Ajustes'},
      h('div',{class:'inner'},
        h('div',{class:'top'},h('h1',{text:'Ajustes'}),h('button',{class:'btn',type:'button',text:'Cerrar',onclick:closeSettings})),
        actualBox,catBox,bkBox));
    $('overlay').replaceChildren(sheet);
  }

  /* ---------- Arranque ---------- */
  function loadAll(){
    return Promise.all([IDB.all('orders'),IDB.all('catalog'),IDB.all('meta')]).then(function(r){
      orders=r[0];catalogs={};r[1].forEach(function(c){catalogs[c.cycle]=c});
      meta={cicloActual:'',lastBackup:null};r[2].forEach(function(m){meta[m.k]=m.v});
      ready=true;loadError=null;if(!form&&!settings)render();
    });
  }
  $('fCycle').addEventListener('change',function(e){ui.cycle=e.target.value;ui.open=null;render()});
  $('fSearch').addEventListener('input',function(e){ui.q=e.target.value;renderList()});
  $('fab').addEventListener('click',function(){if(!ready){toast('Todavía está cargando');return}openForm(null)});
  $('btnExport').addEventListener('click',function(){if(!ready){toast('Todavía está cargando');return}askExport()});
  $('btnSettings').addEventListener('click',function(){if(!ready){toast('Todavía está cargando');return}openSettings()});
  document.addEventListener('keydown',function(e){
    if(e.key!=='Escape')return;
    if(dlgEl){closeDlg();return}
    var lb=document.querySelector('.lightbox');if(lb){lb.remove();back(lastFocus.lb);return}
    if(form){closeForm();return}
    if(settings){closeSettings();return}
  });
  render();
  IDB.open().then(loadAll).then(function(){
    if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){});
    if(!meta.cicloActual&&!orders.length)openSettings();
  }).catch(function(){
    ready=true;loadError='Este navegador no permite guardar datos (¿ventana privada?). Abrí la app en una ventana normal.';render();
  });
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
    window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
  }
})();
</script>
</body>
</html>
