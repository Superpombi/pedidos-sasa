name: Actualizar catalogo

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  catalogo:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Leer revistas y armar catalogo
        run: node scripts/build-catalog.js
      - name: Guardar cambios
        if: always()
        run: |
          git config user.name "catalogo-bot"
          git config user.email "catalogo-bot@users.noreply.github.com"
          mkdir -p informes
          date -u +"%Y-%m-%d %H:%M UTC" > informes/ultima-corrida.txt
          git add -A
          git diff --cached --quiet || (git commit -m "Catalogo $(date -u +%F)" && git push)
